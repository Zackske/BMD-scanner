name: Build BMD Scan APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle --version | grep -Fx 'Gradle 8.9'

      - name: Set test signing path
        run: echo "BMD_DEBUG_KEYSTORE=${RUNNER_TEMP}/bmd-signing/debug.keystore" >> "$GITHUB_ENV"

      - name: Restore test signing key
        id: signing-key
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BMD_DEBUG_KEYSTORE }}
          key: bmd-debug-signing-v2

      - name: Prepare test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$BMD_DEBUG_KEYSTORE")"
          if [[ ! -s "$BMD_DEBUG_KEYSTORE" ]]; then
            keytool -genkeypair -keystore "$BMD_DEBUG_KEYSTORE" -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$BMD_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey

      - name: Preserve signing key before emulator setup
        if: steps.signing-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BMD_DEBUG_KEYSTORE }}
          key: bmd-debug-signing-v2

      - name: Build and lint Debug APK
        # Check offline artwork and ensure private registers are excluded.
        run: |
          python3 ci/check-customer-portal.py
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest

      - name: Verify APK package and signature
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMD-ScanTovenaar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
          # Ignore unavailable guest performance MSRs on nested CI CPUs.
          echo 1 | sudo tee /sys/module/kvm/parameters/ignore_msrs
          cat /sys/module/kvm/parameters/ignore_msrs

      - name: Verify customer portal and menu responsiveness on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BMD_SUITE: portal-menus
          BMD_ANDROID_CLASSES: com.bmd.scanner.CustomerPortalTest,com.bmd.scanner.ThemeIntegrationTest
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 1536M
          heap-size: 256M
          emulator-boot-timeout: 240
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back imagefile:${{ github.workspace }}/camera-fixture.png -camera-front none
          script: bash ci/design-tests.sh

      - name: Upload portal and heading evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BMD-Scan-portal-checks
          path: device-screenshots/
          if-no-files-found: ignore

      - name: Verify pinch zoom and settings on Android
        # Portal and heading checks run first, while camera checks retain a fresh emulator.
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BMD_SUITE: scanner-settings
          BMD_ANDROID_CLASSES: com.bmd.scanner.PinchCameraZoomTest,com.bmd.scanner.ScannerSettingsTest,com.bmd.scanner.StackThemeScreensTest,com.bmd.scanner.BoxCaptureFlowTest,com.bmd.scanner.PicklistFlowTest
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 1536M
          heap-size: 256M
          emulator-boot-timeout: 240
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back imagefile:${{ github.workspace }}/camera-fixture.png -camera-front none
          script: bash ci/design-tests.sh

      - name: Verify existing features on a fresh Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BMD_ANDROID_CLASSES: com.bmd.scanner.DesignValidationTest,com.bmd.scanner.CameraControlsTest,com.bmd.scanner.NativeBulkTest,com.bmd.scanner.GuidedBoxTest,com.bmd.scanner.ScanWizardTest,com.bmd.scanner.MetalRenderingTest
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 1536M
          heap-size: 256M
          emulator-boot-timeout: 240
          disable-animations: false
          emulator-options: -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back imagefile:${{ github.workspace }}/camera-fixture.png -camera-front none
          script: bash ci/design-tests.sh

      - name: Upload native screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BMD-Scan-native-checks
          path: device-screenshots/
          if-no-files-found: ignore

      - name: Save native scanner and lot test screenshots
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence="docs/screenshots/attempt-${GITHUB_RUN_NUMBER}"
          mkdir -p "$evidence"
          find device-screenshots -name '*.png' -exec cp {} "$evidence/" \;
          if [[ "${{ job.status }}" == "success" ]]; then
            mkdir -p docs/screenshots/build3
            find device-screenshots -name 'build3-*.png' -exec cp {} docs/screenshots/build3/ \;
          fi
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: save Android check evidence [skip ci]"
          git push origin HEAD:main

      - name: Publish APK for phone testing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          apk="BMD-Scan-${version}-build.${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "BMD Scan ${version} – build ${GITHUB_RUN_NUMBER}" --notes-file "docs/releases/${version}.md"

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7

