name: Build BMD Scan APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle --version | grep -Fx 'Gradle 8.9'

      - name: Keep debug signing key for subsequent test builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bmd-debug-keystore-v1

      - name: Build and lint Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest

      - name: Verify APK package and signature
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMD-ScanTovenaar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Verify native design, languages and live scanner on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 1536M
          heap-size: 256M
          emulator-boot-timeout: 240
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back imagefile:${{ github.workspace }}/camera-fixture.png -camera-front none
          script: bash ci/design-tests.sh

      - name: Upload native screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BMD-Scan-native-checks
          path: device-screenshots/
          if-no-files-found: ignore

      - name: Save native scanner and lot test screenshots
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/screenshots/build3
          find device-screenshots -name 'build3-*.png' -exec cp {} docs/screenshots/build3/ \;
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/build3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: save native design and language checks [skip ci]"
          git push origin HEAD:main

      - name: Publish APK for phone testing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk BMD-Scan.apk
          gh release create "$tag" BMD-Scan.apk --target "$GITHUB_SHA" --title "BMD Scan ${version}" --notes "BMD Scan 3.2 experimental test build. Guided counted box sessions, overview and overlapping detail captures, proposed image alignment with explicit operator confirmation, lot-coloured code borders, grouping review, and local/share session packages. No automatic shipment approval. Real 95-product carton recognition and cross-photo identity are not validated. Additional detail captures and physical-phone testing are required."

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7




