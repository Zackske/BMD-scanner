name: Diagnose real box photos
on:
  push:
    branches: [research/real-box-decoding]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install zxing-cpp==2.3.0 Pillow==11.1.0
      - run: python tools/real-box-benchmark.py
      - run: python tools/inspect-native-linear.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect linear readers on unaltered images
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar -o core.jar
          curl -fsSL https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o junit.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o hamcrest.jar
          mkdir -p linear-classes
          javac -cp core.jar:junit.jar -d linear-classes app/src/test/java/com/bmd/scanner/PhysicalCodeReaderTest.java tools/InspectLinear.java app/src/main/java/com/bmd/scanner/PhysicalCodeReader.java app/src/main/java/com/bmd/scanner/ScanTracker.java
          java -cp linear-classes:core.jar:junit.jar:hamcrest.jar org.junit.runner.JUnitCore com.bmd.scanner.PhysicalCodeReaderTest
          java -cp linear-classes:core.jar com.bmd.scanner.InspectLinear | tee diagnostics/linear.txt
      - uses: actions/upload-artifact@v4
        with:
          name: real-box-diagnostics
          path: diagnostics/
      - name: Save diagnostic report
        run: |
          cp diagnostics/report.json test-data/real-box/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test-data/real-box/report.json
          git commit -m 'Record real box diagnostic results [skip ci]'
          git push

