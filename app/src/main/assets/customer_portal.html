  function noteKey(value){return String(value).replace(/^\s*[*•]\s*/,'').trim().replace(/\s+/g,' ').toLowerCase();}
  const noteKeys={'coo':3,'coo (certificate of origin)':3,'eur.1':4,'eur. 1':4,'shipmentlist':5,'costumer invoice':6,'customer invoice':6,'invoice nefeza in excel format':7,'hawb (house air way bill)':8,'coa (certificate of analysis)':9,'coa':9,'invoice':10,'documents directly to costumer in dhl envelope:':15,'documents directly to costumer in envelope:':16,'documents on top of box':17,'no documents in box!':18,'no documents in the box!':18,'original eur.1 goes with shipper':19,'all documents in evolope that goes with the driver':20,'boxes on pallet':21,'boxes wrapped foil':22,'maximum pallet high 145cm':23,'sent dimentions':24,'sent dimentions to customer':24,'data loggin':25,'india label':26,'prio':27,'label on the box, buklet inside of the box and in the email':31,'atr document required':32};
  Object.assign(noteKeys,{'coc':9,'hawb':8,'awb':8,'(h)awb':8,'original eur.1':19});
  function translateShippingLine(value){
    const text=String(value).replace(/^\s*[*•]\s*/,'').trim(),key=noteKey(text),w=shippingWords[state.language];
    if(Object.hasOwn(noteKeys,key))return w[noteKeys[key]];
    if(/^(?:coc\/s|coc|cos)$/i.test(text))return text;
    let match=text.match(/^(\d+)\s*x\s*(.+)$/i);if(match)return match[1]+' × '+translateShippingLine(match[2]);
    match=text.match(/^(.*?)\s*\(\s*(?:signature\s*\+\s*)?\+?\s*stamp\s*\)$/i);if(match)return translateShippingLine(match[1])+' ('+w[/signature/i.test(text)?13:14]+')';
    match=text.match(/^(original|copy)\s+(.+)$/i);if(match)return w[match[1].toLowerCase()==='original'?11:12]+' '+translateShippingLine(match[2]);
    match=text.match(/^all original documents must be sen[dt] to the office of (.+?) directly,\s*using their dhl account$/i);if(match)return w[30].replace('{office}',match[1]);
    match=text.match(/^invoice\s*=\s*(.+)$/i)||text.match(/^invoice\s+(.+)$/i);if(match)return w[28]+' '+match[1];
    return text;
  }
  function shippingSections(c){
    const customs=[],extra=[];const doc=/^(?:coo(?: \(certificate of origin\))?|eur\.\s*1|shipmentlist|costumer invoice|customer invoice|invoice nefeza in excel format|hawb \(house air way bill\)|coa(?: \(certificate of analysis\))?|coc\/s|coc|cos|atr document required|invoice .+)$/i;
    for(const raw of shippingInfoLines([...(c.shipping||[]),...(c.extraShipping||[])])){
      const text=raw.replace(/^\s*[*•]\s*/,'').trim();
      if((doc.test(text)||/^(?:\(h\)awb|h?awb)$/i.test(text))&&!/(?:signature|stamp)/i.test(text)){if(!customs.some(v=>noteKey(v)===noteKey(text)))customs.push(text);continue;}
      if(/\b(?:fed\s*ex|ups|dhl|tnt|dpd)\b/i.test(text)&&!Object.hasOwn(noteKeys,noteKey(text))&&!/\b(?:documents?|envelope)\b/i.test(text))continue;
      if(!Object.hasOwn(noteKeys,noteKey(text))&&/^[A-Z0-9][A-Z0-9.-]{3,}(?:\s*\([^)]*\))?$/i.test(text)&&/\d/.test(text))continue;
      extra.push(text);
    }
    const rank=value=>/^coo(?:\s*\(|$)/i.test(value)?0:/^eur\.\s*1$/i.test(value)?1:/^co[ac](?:\s*\(|$)/i.test(value)?2:3;
    const ordered=customs.map((value,index)=>({value,index,rank:rank(value)})).sort((a,b)=>a.rank-b.rank||a.index-b.index).map(row=>row.value);
    return {customs:ordered,extra,box:(c.documents||[]).filter(v=>typeof v==='string'&&v.trim())};
  }
  function documentList(values,eurRequired=false,smallRequirements=false){
    if(!values.length)return '<p class="cp-notes">'+esc(fieldCopy[state.language][18])+'</p>';
    let html='',items=[];const flush=()=>{if(items.length){html+='<ul class="cp-document-list">'+items.map(v=>'<li>'+v+'</li>').join('')+'</ul>';items=[];}};
    for(const value of values){const translated=translateShippingLine(value);if(noteKey(value)==='documents on top of box'){flush();const hasEur=eurRequired||values.some(v=>/eur\.\s*1/i.test(v));html+='<p class="cp-info-intro">'+esc(translated.split('\n').filter((line,i)=>i!==2||hasEur).join('\n'))+'</p>';}else if(/[:：]\s*$/.test(translated)){flush();html+='<p class="cp-info-intro">'+esc(translated)+'</p>';}else{const plain=value.replace(/\s*\(\s*(?:signature\s*\+\s*)?\+?\s*stamp\s*\)\s*$/i,'');if(smallRequirements&&plain!==value){const requirement=shippingWords[state.language][/signature/i.test(value)?13:14];items.push('<span class="cp-requirement-item"><span>'+esc(translateShippingLine(plain))+'</span><small>'+esc(requirement)+'</small></span>');}else items.push(esc(translated));}}flush();return html;
  }

  function boxDocumentList(values){
    if(!values.some(value=>noteKey(value)==='documents on top of box'))return documentList(values);
    const copy=pouchCopy[state.language],w=shippingWords[state.language],invoices=[],shipments=[],eur=[],other=[];
    for(const value of values){
      if(noteKey(value)==='documents on top of box')continue;
      const text=value.replace(/^\s*[*•]\s*/,'').trim(),plain=text.replace(/\s*\(\s*(?:signature\s*\+\s*)?\+?\s*stamp\s*\)\s*$/i,'');
      const requirements=plain!==text?w[/signature/i.test(text)?13:14]:'';
      const item='<div class="cp-pouch-item"><span>'+esc(translateShippingLine(plain))+'</span>'+(requirements?'<small>'+esc(requirements)+'</small>':'')+'</div>';
      if(/^(?:\d+\s*x\s*)?invoice\b/i.test(text))invoices.push(item);
      else if(/^(?:\d+\s*x\s*)?shipmentlist\b/i.test(text))shipments.push(item);
      else if(/\beur\.\s*1\b/i.test(text))eur.push(item);

    }
    const group=(label,items)=>items.length?'<div class="cp-pouch-group"><h5>'+esc(label)+':</h5><div>'+items.join('')+'</div></div>':'';
    return '<p class="cp-info-intro">'+esc(copy[0])+'</p><div class="cp-pouch-table">'+group(copy[1],[...invoices,...shipments])+group(copy[2],eur)+'</div>'+(other.length?documentList(other):'');
  }

  function fitDetailTabs(){

      email.style.removeProperty('font-size');let size=parseFloat(getComputedStyle(email).fontSize);
      while(size>8&&email.scrollWidth>email.clientWidth+1){size=Math.max(8,size-.25);email.style.fontSize=size+'px';}
    }
    for(const button of root.querySelectorAll('.cp-detail-tab,.cp-shipping-tab')){
      if(!button.getClientRects().length)continue;
      button.style.removeProperty('font-size');let size=parseFloat(getComputedStyle(button).fontSize);
