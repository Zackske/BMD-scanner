    const source=c.identitySource,identityProvenance=source?'<p class="cp-source">'+esc(source.file)+' · '+esc(source.sheet)+' · '+esc(source.row?'A'+source.row+':C'+source.row:source.rows.map(r=>'A'+r+':C'+r).join(', '))+'</p>':'';
    if(!c.sourceSheet)return html+section(f[1],'<dl>'+pair(f[15],country(c.country))+'</dl>',true)+(source?section(f[5],identityProvenance):'<p class="cp-missing">'+esc(f[19])+'</p>');
    const a=c.address;html+=section(f[1],'<dl>'+pair(f[10],a.street1)+(a.street2?pair(f[11],a.street2):'')+(a.street3?pair(f[12],a.street3):'')+pair(f[13],a.postalCode)+pair(f[14],a.city)+pair(f[15],country(c.country))+'</dl>',true);
    html+=section(f[2],'<dl>'+pair(f[16],c.shipping.join('\n'))+pair(f[17],c.extraShipping.join('\n'))+'</dl>');
    html+=section(f[3],'<p class="cp-notes">'+esc(c.documents.join('\n')||empty)+'</p>');
    if(c.other.length||Object.keys(c.sourceStatus).length)html+=section(f[4],'<dl>'+pair(f[21],c.sourceGroup)+Object.entries(c.sourceStatus).map(([k,v])=>pair(f[22]+' · '+k,yesNo(v))).join('')+c.other.map(item=>pair(item.cell,yesNo(item.value))).join('')+'</dl>');
    html+=section(f[5],identityProvenance+'<p class="cp-source">'+esc(c.sourceSheet)+'</p><table class="cp-source-table" aria-label="'+esc(f[5])+'"><tbody>'+c.rawCells.map(item=>'<tr><td>'+esc(item.cell)+'</td><td>'+(item.kind==='image'?'<img class="cp-source-image" src="'+assets.media[item.media]+'" alt="'+esc(country(c.country))+'" />':esc(yesNo(item.value)))+'</td></tr>').join('')+'</tbody></table>');
    return html;
  }
  function page(amount){state.page=Math.max(0,Math.min(pageCount()-1,state.page+amount));render();window.scrollTo(0,0);persist();}
  function close(){const id=state.selected;state.selected=null;render();const trigger=root.querySelector('[data-customer="'+id+'"]');if(trigger)trigger.focus({preventScroll:true});window.scrollTo(0,listScroll);persist();}
  root.querySelector('.cp-search-input').addEventListener('input',e=>{state.query=e.target.value;state.page=0;state.selected=null;render();persist();});
  root.querySelector('.cp-next').addEventListener('click',()=>page(1));root.querySelector('.cp-previous').addEventListener('click',()=>page(-1));
  grid.addEventListener('click',e=>{const button=e.target.closest('[data-customer]');if(!button)return;listScroll=window.scrollY;state.selected=button.dataset.customer;lastTrigger=button;render();const detail=root.querySelector('.cp-detail');if(!matchMedia('(prefers-reduced-motion: reduce)').matches)detail.animate([{opacity:0,transform:'translateY(18px) scale(.96)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});root.querySelector('.cp-close').focus({preventScroll:true});window.scrollTo(0,0);persist();});
  root.querySelector('.cp-back')?.addEventListener('click',()=>{if(state.selected){close();return;}const back=root.querySelector('.cp-back');if(!matchMedia('(prefers-reduced-motion: reduce)').matches)back.animate([{transform:'scale(1)'},{transform:'scale(.93)'},{transform:'scale(1)'}],{duration:220});});
  root.querySelector('.cp-close').addEventListener('click',close);layer.addEventListener('click',e=>{if(e.target===layer)close();});
  root.addEventListener('keydown',e=>{if(state.selected&&e.key==='Escape'){e.preventDefault();close();}});
  
  document.fonts.ready.then(fitNames);
  let lastWidth=app.clientWidth;new ResizeObserver(()=>{if(app.clientWidth!==lastWidth){lastWidth=app.clientWidth;fitNames();}}).observe(app);
  function icons(){
    const paths={'search':'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>','chevron-left':'<path d="m15 18-6-6 6-6"/>','chevron-right':'<path d="m9 18 6-6-6-6"/>','sparkles':'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>'};
    root.querySelectorAll('[data-lucide]').forEach(node=>{const path=paths[node.dataset.lucide];if(path)node.outerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+path+'</svg>';});
  }
  const privateCopy={
    nl:['Privé klantenlijst','Importeer je klantenbestand. De gegevens blijven op dit apparaat en werken daarna offline.','Klantenbestand importeren','Klantenbestand vervangen','Dit bestand kan niet worden geïmporteerd. Gebruik het meegeleverde klantenbestand. Je bestaande lijst blijft behouden.'],
    en:['Private customer register','Import your customer file. The data stays on this device and works offline.','Import customer file','Replace customer file','This file could not be imported. Use the supplied customer file. Your existing register is unchanged.'],
    uk:['Приватний список клієнтів','Імпортуйте файл клієнтів. Дані залишаються на цьому пристрої та працюють офлайн.','Імпортувати файл клієнтів','Замінити файл клієнтів','Не вдалося імпортувати файл. Використайте наданий файл клієнтів. Поточний список збережено.'],
    tr:['Özel müşteri listesi','Müşteri dosyanızı içe aktarın. Veriler bu cihazda kalır ve çevrimdışı çalışır.','Müşteri dosyasını içe aktar','Müşteri dosyasını değiştir','Dosya içe aktarılamadı. Sağlanan müşteri dosyasını kullanın. Mevcut listeniz korundu.'],
    it:['Elenco clienti privato','Importa il file clienti. I dati restano su questo dispositivo e funzionano offline.','Importa file clienti','Sostituisci file clienti','Impossibile importare il file. Usa il file clienti fornito. L’elenco attuale è stato conservato.'],
    de:['Private Kundenliste','Importiere deine Kundendatei. Die Daten bleiben auf diesem Gerät und funktionieren offline.','Kundendatei importieren','Kundendatei ersetzen','Diese Datei konnte nicht importiert werden. Verwende die bereitgestellte Kundendatei. Deine bisherige Liste bleibt erhalten.'],
    fr:['Liste de clients privée','Importez votre fichier clients. Les données restent sur cet appareil et fonctionnent hors ligne.','Importer le fichier clients','Remplacer le fichier clients','Impossible d’importer ce fichier. Utilisez le fichier clients fourni. Votre liste actuelle est conservée.'],
    es:['Lista privada de clientes','Importa tu archivo de clientes. Los datos permanecen en este dispositivo y funcionan sin conexión.','Importar archivo de clientes','Reemplazar archivo de clientes','No se pudo importar este archivo. Usa el archivo de clientes facilitado. Tu lista actual se conserva.'],
    pt:['Lista privada de clientes','Importe o ficheiro de clientes. Os dados ficam neste dispositivo e funcionam offline.','Importar ficheiro de clientes','Substituir ficheiro de clientes','Não foi possível importar este ficheiro. Utilize o ficheiro fornecido. A lista atual foi preservada.'],
    hi:['निजी ग्राहक सूची','ग्राहक फ़ाइल आयात करें। डेटा इसी डिवाइस पर रहता है और ऑफ़लाइन काम करता है।','ग्राहक फ़ाइल आयात करें','ग्राहक फ़ाइल बदलें','यह फ़ाइल आयात नहीं हो सकी। दी गई ग्राहक फ़ाइल का उपयोग करें। आपकी मौजूदा सूची सुरक्षित है।']
  };
  function renderImport(){
    const t=privateCopy[state.language],detail=!!state.selected;
    let panel=root.querySelector('.cp-import');
    if(!panel){panel=document.createElement('section');panel.className='cp-import';root.querySelector('.cp-brand').before(panel);}
    panel.hidden=detail;
    panel.innerHTML=(!customers.length?'<h2>'+esc(t[0])+'</h2><p>'+esc(t[1])+'</p>':'')+'<button type="button" class="cp-import-button">'+esc(t[customers.length?3:2])+'</button><p class="cp-import-error" role="alert" hidden></p>';
    panel.querySelector('button').onclick=()=>window.BmdPortalSession?.importCustomers();
    if(!customers.length){grid.hidden=true;root.querySelector('.cp-paging').hidden=true;root.querySelector('.cp-position').textContent='';}
  }
  window.BmdCustomerPortal={
    ready:false,
    back(){if(state.selected){close();return true;}return false;},
    snapshot(){return {...state};},
    importError(){const e=root.querySelector('.cp-import-error');e.textContent=privateCopy[state.language][4];e.hidden=false;},
    applyAppearance(theme,language,brand){
      if(!themeIds.includes(theme)||!copy[language])return false;
      state.theme=theme;state.language=language;nativeBrand=brand||'ScanTovenaar';
      render();persist();return true;
    }
  };
  restore(bootstrap);render();
  document.fonts.ready.then(()=>{fitNames();window.BmdCustomerPortal.ready=true;});

})();
</script>
