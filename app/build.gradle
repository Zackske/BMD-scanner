plugins { id 'com.android.application' }

android {
    namespace 'com.bmd.scanner'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bmd.scanner'
        minSdk 26
        targetSdk 35
        versionCode 39
        versionName '4.7.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testInstrumentationRunnerArguments timeout_msec: '300000'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            def testKey = System.getenv('BMD_DEBUG_KEYSTORE')
            if (testKey) {
                storeFile file(testKey)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'io.github.zxing-cpp:android:2.3.0'
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
}

tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    testLogging { exceptionFormat = 'full' }
}

